name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '^8.0'
            composer_options: '--no-security-blocking'
          - php: '8.2'
            laravel: '11.*'
            testbench: '^9.0'
            composer_options: ''
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
            composer_options: ''
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
            composer_options: ''
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            composer_options: ''
          - php: '8.5'
            laravel: '13.*'
            testbench: '^11.0'
            composer_options: ''

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install matrix dependencies
        run: >-
          composer require
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --dev
          --no-interaction
          --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction ${{ matrix.composer_options }}

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/phpunit
